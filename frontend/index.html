<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Tab</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle%2Capps%2Cadd%2Cmic%2Cbrightness_7">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="topbar">
        <a href="#">Email</a>
        <a href="#">Images</a>
        <a class="material-symbols-outlined" id="Apps" href="#">apps</a>
        <a class="material-symbols-outlined" id="profile" href="#">account_circle</a>
    </div>

    <div class="searchdiv">
        <div class="time">
            <h1 class="timeLbl" id="timeLbl">20:36</h1>
            <h2 id="apm">am</h2>
        </div>

        <div class="searchbox">
            <a class="material-symbols-outlined" id="add" href="#">add</a>

            <input
                type="search"
                placeholder="Search Anything..."
                class="search"
            >

            <a class="material-symbols-outlined" id="mic" href="#">mic</a>
        </div>

    </div>

    <div class="shortcuts">

        <a class="shortcut-card" href="https://stardance.hackclub.com">
            <img src="assets/stardance-logo-df399a7f.avif">
            <h1>Stardance</h1>
        </a>

        <a class="shortcut-card" href="https://hackatime.hackclub.com/?interval=today">
            <img src="assets/Hackatime.png">
            <h1>Hackatime</h1>
        </a>

        <a class="shortcut-card" href="https://github.com">
            <img src="assets/Github.webp">
            <h1>Github</h1>
        </a>

        <div class="shortcut-card">
            <b class="material-symbols-outlined">add</b>
        </div>

    </div>

    <div class="weather-card">

        <span class="material-symbols-outlined" id="weather-icon">
            brightness_7
        </span>

        <div class="weather-info">
            <span id="temperature">28°C</span>
            <span id="location">Kochi</span>
            <span id="status">status</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
